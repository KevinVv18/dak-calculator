<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar una reunión con DAK Agency</title>
    <meta name="description" content="Elegí un horario y conversemos 60 minutos por Google Meet, sin coste.">
    <meta name="theme-color" content="#030106">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="preload" href="assets/fuentes/poppins-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/tokens.css?v=8">
    <link rel="stylesheet" href="css/base.css?v=8">
    <link rel="stylesheet" href="css/cotizacion.css?v=8">
</head>

<body>
<!--
  Misma superficie que el overlay de la calculadora, mismo markup y mismo módulo de
  calendario. Existe aparte porque está enlazada directamente desde la web principal,
  el chat widget y el pie del blog, así que hay prospectos que la ven sin pasar nunca
  por la calculadora.
-->
    <!-- Iconos: SVG dibujados, un solo grosor de trazo. Sustituyen a la fuente
         Material Symbols (cientos de KB para quince glifos, y las ligaduras se
         veian como palabras sueltas antes de que cargara) y a los emoji, que no
         son un sistema de iconos. -->
    <svg width="0" height="0" aria-hidden="true" style="position:absolute">
      <defs>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12.5 9 17.5 20 6.5"/></symbol>
        <symbol id="i-cerrar" viewBox="0 0 24 24"><path d="M6 6 18 18M18 6 6 18"/></symbol>
        <symbol id="i-mas" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="i-menos" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
        <symbol id="i-abajo" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
        <symbol id="i-arriba" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
        <symbol id="i-izq" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
        <symbol id="i-der" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></symbol>
        <symbol id="i-calendario" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
        <symbol id="i-correo" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="m3.5 7 8.5 6 8.5-6"/></symbol>
        <symbol id="i-candado" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="9.5" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></symbol>
        <symbol id="i-salir" viewBox="0 0 24 24"><path d="M9.5 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3.5M16 16.5 20.5 12 16 7.5M20.5 12H10"/></symbol>
        <symbol id="i-ajustes" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
        <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11.5v5M12 7.8v.4"/></symbol>
        <symbol id="i-documento" viewBox="0 0 24 24"><path d="M6 3h8l4.5 4.5V21H6z"/><path d="M14 3v5h4.5M9 12.5h6M9 16.5h4"/></symbol>
        <symbol id="i-vacio" viewBox="0 0 24 24"><path d="M6 3h8l4.5 4.5V21H6z"/><path d="M14 3v5h4.5"/></symbol>
        <symbol id="i-aviso" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5.5M12 16.2v.3"/></symbol>
        <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="6.5" width="12.5" height="11" rx="2"/><path d="m15.5 11 5.5-3v8l-5.5-3z"/></symbol>
        <symbol id="i-diseno" viewBox="0 0 24 24"><path d="M4 20 9 9l5 5-10 6z"/><path d="m12 6.5 5.5 5.5M14.5 4l5.5 5.5-2.5 2.5L12 6.5z"/></symbol>
        <symbol id="i-web" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2"/><path d="M3 9h18M6.5 6.7h.4M9 6.7h.4"/></symbol>
        <symbol id="i-marketing" viewBox="0 0 24 24"><path d="M4 20V13M9.5 20V8M15 20v-8.5M20.5 20V4"/></symbol>
        <symbol id="i-automatizacion" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="11" rx="2.5"/><path d="M12 4v4M8.5 13v1.5M15.5 13v1.5"/></symbol>
        <symbol id="i-libre" viewBox="0 0 24 24"><path d="M4 20h16M5.5 15.5 15 6a2.1 2.1 0 0 1 3 3l-9.5 9.5-4 1 1-4z"/></symbol>
      </defs>
    </svg>

    <div class="agenda agenda--pagina">
        <header class="cabecera">
            <div class="cabecera__fila">
                <div class="cabecera__marca">
                    <svg class="icono icono--lg" aria-hidden="true" style="color:var(--morado-tinta)"><use href="#i-calendario"></use></svg>
                    <div>
                        <h2 id="cita-titulo" class="hoja__titulo">Agendar reunión</h2>
                        <p class="hoja__folio">60 min · Google Meet · sin coste · Lambayeque (GMT-5)</p>
                    </div>
                </div>
                <button type="button" id="cita-cerrar-btn" class="boton-icono" aria-label="Cerrar">
                    <svg class="icono" aria-hidden="true"><use href="#i-cerrar"></use></svg>
                </button>
            </div>
        </header>

        <main class="agenda__cuerpo">
            <p id="cita-loading" class="hoja__vacia">Cargando disponibilidad…</p>

            <div id="cita-error" class="hoja__vacia" hidden>
                <p class="nota nota--error" id="cita-error-msg">No se pudo cargar la disponibilidad.</p>
                <button type="button" id="cita-retry-btn" class="accion accion--segunda" style="margin:var(--e4) auto 0">Reintentar</button>
            </div>

            <section id="cita-left-col" class="agenda__panel" hidden>
                <div class="agenda__mes">
                    <h3 class="hoja__titulo" id="cita-month-title">—</h3>
                    <div class="agenda__nav">
                        <button type="button" id="cita-prev-month" class="boton-icono" aria-label="Mes anterior">
                            <svg class="icono" aria-hidden="true"><use href="#i-izq"></use></svg>
                        </button>
                        <button type="button" id="cita-next-month" class="boton-icono" aria-label="Mes siguiente">
                            <svg class="icono" aria-hidden="true"><use href="#i-der"></use></svg>
                        </button>
                    </div>
                </div>
                <div class="agenda__dias-rotulo" aria-hidden="true">
                    <span>Lu</span><span>Ma</span><span>Mi</span><span>Ju</span><span>Vi</span><span>Sá</span><span>Do</span>
                </div>
                <div class="agenda__rejilla" id="cita-cal-grid"></div>

                <div class="agenda__datos">
                    <label class="campo__rotulo" for="cita-nombre">Tu nombre</label>
                    <input id="cita-nombre" type="text" class="campo-texto" placeholder="Nombre y apellido" maxlength="100" autocomplete="name">
                    <label class="campo__rotulo" for="cita-email">Tu email</label>
                    <input id="cita-email" type="email" class="campo-texto" placeholder="tu@email.com" autocomplete="email">
                </div>
            </section>

            <section id="cita-right-col" class="agenda__panel" hidden>
                <h3 class="hoja__titulo">Horarios libres</h3>
                <div id="cita-slots-container" class="agenda__horas">
                    <p class="nota">Elegí un día en el calendario.</p>
                </div>
                <div id="cita-summary-card" class="aviso" hidden>
                    <svg class="icono" aria-hidden="true"><use href="#i-check"></use></svg>
                    <span id="cita-summary-text">—</span>
                </div>
            </section>

            <div id="cita-confirmacion" class="agenda__panel" hidden>
                <div id="cita-resumen"></div>
            </div>
        </main>

        <footer class="agenda__pie">
            <button type="button" id="cita-btn-cancelar" class="accion accion--segunda">Cancelar</button>
            <button type="button" id="cita-btn-confirmar" class="accion accion--principal" disabled>Confirmar reunión</button>
        </footer>
    </div>

    <script src="js/comun.js?v=8"></script>
    <script src="js/calendario.js?v=8"></script>
    <script src="js/agendar.js?v=8"></script>
</body>

</html>
